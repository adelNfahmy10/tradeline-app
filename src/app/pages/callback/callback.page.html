<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title class="text-center me-5 fw-bold">Call Back</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Pull To Refresh -->
  <ion-refresher
    slot="fixed"
    class="tradeline-refresher"
    (ionRefresh)="handleRefresh($event)"
  >
    <ion-refresher-content
      pullingIcon="chevron-down-outline"
      refreshingSpinner="crescent"
    >
    </ion-refresher-content>
  </ion-refresher>

  <div class="callback py-3">
    <form [formGroup]="callbackForm" (ngSubmit)="submitCallbackForm()">
      <div class="d-flex flex-column gap-3 mx-3">
        <h3>Fill in the below to request a call back</h3>

        <div class="description shadow-sm rounded-4">
          <textarea
            class="form-control rounded-4"
            formControlName="description"
            name="description"
            id="description"
            placeholder="Describe your technical issue"
            rows="5"
          ></textarea>
        </div>

        <div class="name shadow-sm rounded-4">
          <input
            class="form-control rounded-4 py-3 px-3"
            formControlName="name"
            type="text"
            name="name"
            id="name"
            placeholder="Full Name"
          />
        </div>

        <div class="phone shadow-sm rounded-4">
          <input
            class="form-control rounded-4 py-3 px-3"
            formControlName="phone"
            type="tel"
            name="phone"
            id="phone"
            placeholder="Phone Number"
          />
        </div>

        <div class="email shadow-sm rounded-4">
          <input
            class="form-control rounded-4 py-3 px-3"
            formControlName="email"
            type="email"
            name="email"
            id="email"
            placeholder="Email Address"
          />
        </div>

        <div class="serial shadow-sm rounded-4">
          <input
            class="form-control rounded-4 py-3 px-3"
            formControlName="serial"
            type="text"
            name="serial"
            id="serial"
            placeholder="Serial Number"
          />
        </div>

        <div class="details shadow-sm rounded-4">
          <textarea
            class="form-control rounded-4"
            formControlName="details"
            name="details"
            id="details"
            placeholder="Device Details"
            rows="5"
          ></textarea>
        </div>

        <div class="submit">
          <button
            class="btn main-btn w-100 rounded-4 py-2"
            [disabled]="callbackForm.invalid"
          >
            Book Now!
          </button>
        </div>
      </div>

  </div>
</ion-content>
