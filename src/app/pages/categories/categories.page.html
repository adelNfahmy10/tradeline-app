<ion-header [translucent]="true" class="shop-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title class="text-center fw-bold me-5">
      {{ categories?.name }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Pull To Refresh -->
  <ion-refresher
    slot="fixed"
    class="tradeline-refresher"
    (ionRefresh)="handleRefresh($event)"
  >
    <ion-refresher-content
      pullingIcon="chevron-down-outline"
      refreshingSpinner="crescent"
    ></ion-refresher-content>
  </ion-refresher>

  <section class="subcategory-page">
    <div class="container">
      <!-- Category Title -->
      <div class="subcategory-heading">
        <span class="subcategory-eyebrow">EXPLORE COLLECTION</span>
        <h2 class="subcategory-title">{{ categories?.name }}</h2>
        <span class="subcategory-accent"></span>
      </div>

      <!-- Subcategories -->
      <div class="subcategory-list">
        @for (subCat of categories?.cat_subcategories; track $index) {
        <div
          class="subcategory-item"
          [routerLink]="'/sub-categories/' + subCat.seo_slug"
        >
          <div class="subcategory-image">
            @if(subCat.picture){
            <img
              [src]="subCat.picture"
              [alt]="subCat.picture_alt || subCat.seo_slug"
            />
            } @else {
            <img
              loading="lazy"
              src="assets/images/anim-logo.gif"
              alt="Tradeline Stores"
            />
            }
          </div>

          <div class="subcategory-content">
            <h5>{{ subCat.name }}</h5>
          </div>

          <i class="fa-solid fa-chevron-right subcategory-arrow"></i>
        </div>
        }
      </div>
    </div>
  </section>
</ion-content>

<ion-footer>
  <app-tabs></app-tabs>
</ion-footer>
