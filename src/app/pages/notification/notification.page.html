<ion-header [translucent]="true">
  <ion-toolbar>
    @if(token()){
    <ion-buttons slot="start">
      <ion-menu-button class="d-flex justify-content-center align-items-center">
        <div class="head-bg-icon">
          <i class="fa-regular fa-circle-user main-color"></i>
        </div>
      </ion-menu-button>
    </ion-buttons>
    } @else {
    <ion-buttons slot="start">
      <div class="head-bg-icon">
        <i class="fa-regular fa-circle-user main-color" routerLink="/auth"></i>
      </div>
    </ion-buttons>
    }

    <ion-title class="text-center fw-bold">Notifications</ion-title>

    <ion-buttons slot="end">
      <div class="head-bg-icon" (click)="searchModal.open()">
        <i class="fa-brands fa-sistrix main-color"></i>
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Pull To Refresh -->
  <ion-refresher
    slot="fixed"
    class="tradeline-refresher"
    (ionRefresh)="handleRefresh($event)"
  >
    <ion-refresher-content
      pullingIcon="chevron-down-outline"
      refreshingSpinner="crescent"
    >
    </ion-refresher-content>
  </ion-refresher>
  
  <div class="notification p-2 py-3 d-flex flex-column gap-3">
    @for (notification of notifications(); track $index) {
    <div
      class="item d-flex justify-content-start align-items-center gap-3 p-3 rounded-4"
    >
      <div class="item-img">
        <i class="fa-regular main-color fa-bell"></i>
      </div>

      <div class="item-content">
        <h4>{{notification.title}}</h4>
        <p>{{notification.text}}</p>
        <span>{{notification.time | date}}</span>
      </div>
    </div>
    } @empty {
    <app-skeleton-reload />
    }
  </div>

  <app-search-modal #searchModal></app-search-modal>
</ion-content>

<ion-footer>
  <app-tabs></app-tabs>
</ion-footer>
