<ion-header [translucent]="true">
  <ion-toolbar>
    <!-- User Account -->
    <ion-buttons slot="start">
      @if (token()) {
      <ion-menu-toggle>
        <button
          type="button"
          class="header-icon-button"
          aria-label="Open account menu"
        >
          <i class="fa-solid fa-user"></i>
        </button>
      </ion-menu-toggle>
      } @else {
      <button
        type="button"
        class="header-icon-button"
        routerLink="/auth"
        aria-label="Login"
      >
        <i class="fa-solid fa-user"></i>
      </button>
      }
    </ion-buttons>

    <!-- Page Title -->
    <ion-title class="text-center fw-bold"> Explore </ion-title>

    <!-- Search -->
    <ion-buttons slot="end">
      <button
        type="button"
        class="header-icon-button"
        (click)="searchModal.open()"
        aria-label="Search"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Pull To Refresh -->
  <ion-refresher
    slot="fixed"
    class="tradeline-refresher"
    (ionRefresh)="handleRefresh($event)"
  >
    <ion-refresher-content
      pullingIcon="chevron-down-outline"
      refreshingSpinner="crescent"
    >
    </ion-refresher-content>
  </ion-refresher>

  <div class="home">
    <!-- Offers -->
    <app-offer-slider></app-offer-slider>

    <!-- Categories -->
    <app-categories-slider></app-categories-slider>

    <!-- TVC -->
    <div class="tvs-image position-relative my-3" routerLink="/tvc">
      <img
        loading="lazy"
        src="/assets/images/home/tvc-banner-new.png"
        alt="tvc"
        class="tvs w-100 h-100"
      />

      <span class="position-absolute text-white">
        {{ points() | number }} Points
      </span>
    </div>

    <!-- Products -->
    <app-list-items-home></app-list-items-home>
  </div>

  <!-- Search -->
  <app-search-modal #searchModal></app-search-modal>
</ion-content>

<ion-footer>
  <app-tabs></app-tabs>
</ion-footer>
