<ion-header [translucent]="true">
  <ion-toolbar>
    <!-- User Account -->
    <ion-buttons slot="start">
      @if (token()) {
      <ion-menu-toggle>
        <button
          type="button"
          class="header-icon-button"
          aria-label="Open account menu"
        >
          <i class="fa-solid fa-user"></i>
        </button>
      </ion-menu-toggle>
      } @else {
      <button
        type="button"
        class="header-icon-button"
        routerLink="/auth"
        aria-label="Login"
      >
        <i class="fa-solid fa-user"></i>
      </button>
      }
    </ion-buttons>

    <!-- Page Title -->
    <ion-title class="text-center fw-bold"> Shop </ion-title>

    <!-- Search -->
    <ion-buttons slot="end">
      <button
        type="button"
        class="header-icon-button"
        (click)="searchModal.open()"
        aria-label="Search"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Pull To Refresh -->
  <ion-refresher
    slot="fixed"
    class="tradeline-refresher"
    (ionRefresh)="handleRefresh($event)"
  >
    <ion-refresher-content
      pullingIcon="chevron-down-outline"
      refreshingSpinner="crescent"
    >
    </ion-refresher-content>
  </ion-refresher>

  <div class="shop">
    <!-- Nearest Store -->
    <div class="header-shop" routerLink="/nearbystore">
      <div class="store-info">
        <span class="store-title"> Find nearest store </span>

        <span class="store-description">
          Discover stores near your location
        </span>
      </div>

      <span class="store-icon">
        <i class="fa-solid fa-location-dot"></i>
      </span>
    </div>

    <!-- Categories -->
    <div class="categories">
      @for (cat of categories(); track cat.seo_slug) {
      <div class="category-item" [routerLink]="'/categories/' + cat.seo_slug">
        <div class="category-image">
          @if (cat.picture) {
          <img
            loading="lazy"
            [src]="cat.picture"
            [alt]="cat.picture_alt || cat.name"
          />
          } @else {
          <img
            loading="lazy"
            src="assets/images/anim-logo.gif"
            alt="Tradeline Stores"
          />
          }
        </div>

        <div class="category-content">
          <h5>{{ cat.name }}</h5>
        </div>

        <i class="fa-solid fa-chevron-right category-arrow"></i>
      </div>
      } @empty {
      <!-- Skeleton -->
      }
    </div>
  </div>

  <!-- Search -->
  <app-search-modal #searchModal></app-search-modal>
</ion-content>

<!-- Footer -->
<ion-footer>
  <app-tabs></app-tabs>
</ion-footer>
