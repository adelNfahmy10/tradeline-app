<ion-header [translucent]="true">
  <ion-toolbar>
    <!-- User Account -->
    <ion-buttons slot="start">
      @if (token()) {
      <ion-menu-toggle>
        <button
          type="button"
          class="header-icon-button"
          aria-label="Open account menu"
        >
          <i class="fa-solid fa-user"></i>
        </button>
      </ion-menu-toggle>
      } @else {
      <button
        type="button"
        class="header-icon-button"
        routerLink="/auth"
        aria-label="Login"
      >
        <i class="fa-solid fa-user"></i>
      </button>
      }
    </ion-buttons>

    <!-- Page Title -->
    <ion-title class="text-center">
      <picture>
        <source
          srcset="assets/images/support-images/care-white.png"
          media="(prefers-color-scheme: dark)"
        />

        <img
          src="assets/images/support-images/care.png"
          class="tvc-logo"
          alt="TVC"
        />
      </picture>
    </ion-title>

    <!-- Search -->
    <ion-buttons slot="end">
      <button
        type="button"
        class="header-icon-button"
        (click)="searchModal.open()"
        aria-label="Search"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Pull To Refresh -->
  <ion-refresher
    slot="fixed"
    class="tradeline-refresher"
    (ionRefresh)="handleRefresh($event)"
  >
    <ion-refresher-content
      pullingIcon="chevron-down-outline"
      refreshingSpinner="crescent"
    >
    </ion-refresher-content>
  </ion-refresher>

  <div class="support p-2 py-3 d-flex flex-column gap-3">
    <div
      class="item d-flex justify-content-center align-items-center gap-3 p-3 rounded-4"
    >
      <div class="item-img w-100 text-center" routerLink="/service-tracking">
        <picture>
          <source
            srcset="assets/images/support-images/service-tracking-black.png"
            media="(prefers-color-scheme: dark)"
          />

          <img
            loading="lazy"
            src="assets/images/support-images/service-tracking.png"
            class="w-75"
            alt="cat.picture_alt"
          />
        </picture>
      </div>
    </div>

    <div
      class="item d-flex justify-content-center align-items-center gap-3 p-3 rounded-4"
    >
      <div class="item-img w-100 text-center">
        <a href="https://checkcoverage.apple.com/au/en/" target="_blank">
          <picture>
            <source
              srcset="assets/images/support-images/warranty-black.png"
              media="(prefers-color-scheme: dark)"
            />

            <img
              loading="lazy"
              src="assets/images/support-images/warranty.png"
              class="w-75"
              alt="cat.picture_alt"
            />
          </picture>
        </a>
      </div>
    </div>

    <div
      class="item d-flex justify-content-center align-items-center gap-3 p-3 rounded-4"
    >
      <div class="item-img w-100 text-center">
        <a
          href="https://support.apple.com/en-au/exchange_repair"
          target="_blank"
        >
          <picture>
            <source
              srcset="assets/images/support-images/repair-program-black.png"
              media="(prefers-color-scheme: dark)"
            />

            <img
              loading="lazy"
              src="assets/images/support-images/repair-program.png"
              class="w-75"
              alt="cat.picture_alt"
            />
          </picture>
        </a>
      </div>
    </div>
  </div>

  <app-search-modal #searchModal></app-search-modal>
</ion-content>

<ion-footer>
  <app-tabs></app-tabs>
</ion-footer>
