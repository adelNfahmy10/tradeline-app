<ion-header [translucent]="true">
  <ion-toolbar>
    <!-- User Account -->
    <ion-buttons slot="start">
      @if (token()) {
      <ion-menu-toggle>
        <button
          type="button"
          class="header-icon-button"
          aria-label="Open account menu"
        >
          <i class="fa-solid fa-user"></i>
        </button>
      </ion-menu-toggle>
      } @else {
      <button
        type="button"
        class="header-icon-button"
        routerLink="/auth"
        aria-label="Login"
      >
        <i class="fa-solid fa-user"></i>
      </button>
      }
    </ion-buttons>

    <!-- Page Title -->
    <ion-title class="text-center fw-bold"> Explore </ion-title>

    <!-- Search -->
    <ion-buttons slot="end">
      <button
        type="button"
        class="header-icon-button"
        (click)="searchModal.open()"
        aria-label="Search"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher
    slot="fixed"
    class="tradeline-refresher"
    (ionRefresh)="handleRefresh($event)"
  >
    <ion-refresher-content
      pullingIcon="chevron-down-outline"
      refreshingSpinner="crescent"
    ></ion-refresher-content>
  </ion-refresher>

  <section class="tvc-page">
    <div class="tvc-card">
      <button type="button" class="tvc-close" routerLink="/" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="tvc-card__header">
        <div class="tvc-logo">
          <img
            loading="lazy"
            src="/assets/images/tvc-images/TVCLOGOFINALhite-01.png"
            alt="TVC Logo"
          />
        </div>

        <span class="tvc-card__eyebrow">TRADELINE STORES</span>

        <h2 class="tvc-card__title">Welcome, {{ userName }}</h2>

        <p class="tvc-card__subtitle">Your rewards, your benefits.</p>
      </div>

      <div class="tvc-card__points">
        <div class="points-item points-item--valid">
          <div class="points-item__icon">
            <i class="fa-solid fa-coins"></i>
          </div>

          <div class="points-item__info">
            <span class="points-item__label">Valid Points</span>
            <h3>{{ pointsData()?.CurrentValidBalance || 0 | number }}</h3>
          </div>
        </div>

        <div class="points-item points-item--pending">
          <div class="points-item__icon">
            <i class="fa-regular fa-clock"></i>
          </div>

          <div class="points-item__info">
            <span class="points-item__label">Pending Points</span>
            <h3>{{ pointsData()?.CurrentPendingBalance || 0 | number }}</h3>
          </div>
        </div>
      </div>

      <div class="tvc-card__actions">
        <button type="button" class="tvc-details-btn" routerLink="/tvc-details">
          View More
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <button type="button" class="tvc-history-btn" routerLink="/tvc-history">
          <i class="fa-solid fa-clock-rotate-left"></i>
          History
        </button>
      </div>
    </div>
  </section>

  <app-search-modal #searchModal></app-search-modal>
</ion-content>

<ion-footer>
  <app-tabs></app-tabs>
</ion-footer>
