@if (categoriesBanners().length) {
<!-- Categories Banners Section -->
<div class="categories-banners mx-2">
  <h2 class="fw-bold px-2 mb-0">Categories</h2>

  <swiper-container
    class="mySwiper w-100 h-100 px-1 my-2"
    slides-per-view="3"
    space-between="10"
    free-mode="true"
  >
    @for (cat of categoriesBanners(); track $index) {
    <swiper-slide
      class="d-flex justify-content-center align-items-center gap-1 text-center rounded-3 my-2 mx-1"
      [routerLink]="cat?.seo_slug ? '/categories/' + cat?.seo_slug : '/shop'"
    >
      <div class="text-center">
        <div class="image-cat rounded-3">
          <img
            loading="lazy"
            class="rounded-3"
            [src]="cat?.picture"
            [alt]="cat?.name"
          />
        </div>
        <span class="fw-bold mt-2 d-inline-block cat-name">{{
          cat?.name
        }}</span>
      </div>
    </swiper-slide>
    }
  </swiper-container>
</div>
}
